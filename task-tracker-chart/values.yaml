registry: localhost:5001

postgres:
  image: postgres:16-alpine
  serviceAccount: postgres-sa
  storage: 1Gi
  secret:
    user: taskuser
    password: t1a2s3k4
    db: taskdb

backend:
  image:
    repository: task-backend
    tag: v1
  serviceAccount: backend-sa
  autoscaling:
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}
  port: 8000

frontend:
  image:
    repository: task-frontend
    tag: v1
  serviceAccount: frontend-sa
  replicaCount: 2
  port: 80

networkPolicies:
- {app: backend, port: 8000}
- {app: frontend, port: 80}